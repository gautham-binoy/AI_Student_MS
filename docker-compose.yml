version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai_attendance_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/database/app.db
      - FACE_MODEL_PATH=models/yolov8n-face.pt
      - FACE_CONFIDENCE_THRESHOLD=0.50
      - FACE_MATCH_THRESHOLD=0.55
      - MIN_CONFIRMATION_SECONDS=2.0
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ai_attendance_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
